name = "ab-tech-catalogue-auth"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[vars]
# Production Pages origin, with no path and no trailing slash.
ALLOWED_ORIGIN = "https://ab-tech-one-solution.pages.dev"
GITHUB_REPO = "johernlim/AB-Tech-One-Solution"
FIREBASE_WEB_API_KEY = "AIzaSyDCo4MNXiJFIlE58hWo3Zr0S_FizVbszkw"
FIREBASE_PROJECT_ID = "ab-tech-one"
# Set GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET as Worker secrets.
# Staff accounts additionally need STAFF_INVITE_CODE, STAFF_PASSWORD_PEPPER,
# GITHUB_CATALOGUE_TOKEN runtime secrets and a STAFF_DB D1 binding.
# Customer reset emails additionally need a verified Cloudflare sending domain,
# RESET_EMAIL_FROM and a RESET_EMAIL send_email binding. See
# ../docs/CUSTOMER-EMAIL-SETUP.md before enabling the binding.
# Alternatively set FIREBASE_WEB_API_KEY and FIREBASE_PROJECT_ID under [vars]
# for Firebase customer login/reset emails. See ../docs/FIREBASE-AUTH-SETUP.md.

[[d1_databases]]
binding = "STAFF_DB"
database_name = "ab-tech-staff"
database_id = "13b8873f-d024-4aa8-8d7f-ea871aff0e5e"
